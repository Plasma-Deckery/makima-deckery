[package]
name = "makima-deckery"
version = "0.3.0"
edition = "2021"

[dependencies]
evdev = { version = "0.12.1", features = ["tokio", "serde"] }
tokio = { version = "1.28.1", features = ["full"] }
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.117"
tokio-stream = "0.1.14"
tokio-udev = "0.9.1"
swayipc-async = "2.0.2"
x11rb = "0.13.0"
toml = "0.7.3"
fork = "0.1.23"
zbus = { version = "3", features = ["tokio"] }
notify = "6"
libc = "0.2"

[patch.crates-io]
# evdev 0.12.1 is missing BTN_GRIPL/GRIPR/GRIPL2/GRIPL2 (Steam Deck back paddles, 0x224-0x227).
# Using our fork until a new upstream release includes these codes.
# Track: https://github.com/emberian/evdev/pull/178
evdev = { git = "https://github.com/Plasma-Deckery/evdev", rev = "e428a6fe10c0f577ef05c38e85eaefd6eed8be1b" }

# Fedora's %cargo_build RPM macro always builds with `--profile rpm`, which
# must be defined in Cargo.toml itself (Cargo profiles can't be created via
# CLI flags alone). Normally Fedora's %cargo_prep macro patches this in
# automatically, but we don't use %cargo_prep — its vendoring mode doesn't
# reliably handle git dependencies like our evdev fork above, so we vendor
# and configure Cargo ourselves (see .copr/Makefile, packaging/*.spec).
[profile.rpm]
inherits = "release"
debug = true
